packages:
  - apps/*
  - packages/*

# One place to pin versions shared by several workspaces ("catalog:" in package.json).
catalog:
  "@aws-sdk/client-dynamodb": ^3.1157.0
  "@aws-sdk/client-s3": ^3.1157.0
  "@aws-sdk/lib-dynamodb": ^3.1157.0
  "@aws-sdk/s3-request-presigner": ^3.1157.0
  "@eslint/js": ^10.0.1
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.105.0
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  "@types/aws-lambda": ^8.10.164
  "@types/node": ^24.0.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^6.1.2
  "@vitest/coverage-v8": ^5.0.5
  aws-amplify: ^6.22.2
  aws-sdk-client-mock: ^4.1.0
  esbuild: ^0.28.2
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-jsdoc: ^65.4.2
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  globals: ^17.13.0
  jsdom: ^30.1.3
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  turbo: ^2.11.10
  typedoc: ^0.28.20
  # typescript-eslint and TypeDoc support TypeScript up to 6.0.x (not the 7.x native port yet).
  typescript: ~6.0.3
  typescript-eslint: ^8.72.1
  uuid: ^14.0.3
  vite: ^8.3.5
  vitest: ^5.0.5
  zod: ^4.6.7

minimumReleaseAgeExclude:
  - "@aws-sdk/checksums@3.1001.6"
  - "@aws-sdk/client-dynamodb@3.1157.0"
  - "@aws-sdk/client-s3@3.1157.0"
  - "@aws-sdk/core@3.978.6"
  - "@aws-sdk/credential-provider-env@3.972.77"
  - "@aws-sdk/credential-provider-http@3.972.79"
  - "@aws-sdk/credential-provider-ini@3.973.22"
  - "@aws-sdk/credential-provider-login@3.972.84"
  - "@aws-sdk/credential-provider-node@3.972.89"
  - "@aws-sdk/credential-provider-process@3.972.77"
  - "@aws-sdk/credential-provider-sso@3.973.21"
  - "@aws-sdk/credential-provider-web-identity@3.972.83"
  - "@aws-sdk/dynamodb-codec@3.973.51"
  - "@aws-sdk/lib-dynamodb@3.1157.0"
  - "@aws-sdk/middleware-endpoint-discovery@3.972.35"
  - "@aws-sdk/middleware-sdk-s3@3.972.82"
  - "@aws-sdk/nested-clients@3.997.51"
  - "@aws-sdk/s3-request-presigner@3.1157.0"
  - "@aws-sdk/token-providers@3.1157.0"
  - "@smithy/core@3.37.0"
  - "@smithy/node-http-handler@4.13.0"
  - "@typescript-eslint/eslint-plugin@8.72.1"
  - "@typescript-eslint/parser@8.72.1"
  - "@typescript-eslint/project-service@8.72.1"
  - "@typescript-eslint/scope-manager@8.72.1"
