  - "@typescript-eslint/utils@8.72.1"
  - "@typescript-eslint/visitor-keys@8.72.1"
  - typescript-eslint@8.72.1

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  esbuild: true
